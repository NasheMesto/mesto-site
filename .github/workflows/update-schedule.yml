name: Update events from Todo
on:
  schedule:
    # Sunday 23:00 UTC = Monday 06:00 Asia/Bangkok. GitHub may delay scheduled runs.
    - cron: '0 23 * * 0'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: update-todo-schedule
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and validate public events
        run: node tools/sync-todo.mjs
      - name: Save complete schedule
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update events from Todo.Today'
            git push
          fi
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
